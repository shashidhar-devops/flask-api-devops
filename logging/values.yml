loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: flask-api-loki-logs-253264393553
      ruler: flask-api-loki-logs-253264393553
      admin: flask-api-loki-logs-253264393553
    s3:
      region: us-east-1
      s3ForcePathStyle: false
  limits_config:
    retention_period: 72h

compactor:
  replicas: 0
  retention_enabled: true
  compaction_interval: 24h

serviceAccount:
  create: false
  name: loki-s3-sa

deploymentMode: Monolithic

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
  persistence:
    enabled: true
    type: ephemeral
    storageClass: ebs-sc
chunksCache:
  enabled: false

resultsCache:
  enabled: false

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
